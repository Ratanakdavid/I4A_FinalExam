- name: Deploy and Backup Terrain Rentals
  hosts: web_server_group
  tasks:
    - name: Fetch latest code and reset
      ansible.builtin.shell: |
        git reset --hard HEAD
        git pull origin Exam
      args:
        chdir: /home/ratanakdavid/Documents/terrain-rentals/

    - name: Build project with Maven
      ansible.builtin.shell: ./mvnw clean package -DskipTests
      args:
        chdir: /home/ratanakdavid/Documents/terrain-rentals/

    - name: Run tests with SQLite profile
      ansible.builtin.shell: ./mvnw test -Dspring.profiles.active=test
      args:
        chdir: /home/ratanakdavid/Documents/terrain-rentals/
      register: test_output

    - name: Backup MySQL database
      ansible.builtin.shell: >
        docker compose exec mysql-db mysqldump -u ratanakdavid -p'Hello@123' 
        A-Ratanakdavid-db > backup.sql
      args:
        chdir: /home/ratanakdavid/Documents/terrain-rentals/

    - name: Show test results for screenshot
      ansible.builtin.debug:
        var: test_output.stdout_lines
